<!DOCTYPE html>
<html lang="pt-br" class="size-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="w-full h-full flex flex-col justify-center items-center overflow-hidden bg-[#0c0c0c]">
    <section>
        <div id="placar" class="flex flex-row justify-center items-center gap-x-2 mb-5 p-2.5 rounded-lg bg-black">
            <i class="inline text-6xl font-semibold text-[#0c0c0c] ri-circle-line"></i>
            <p class="text-white font-arial font-medium text-3xl">0 - 0</p>
            <i class="inline text-6xl text-[#0c0c0c] ri-close-large-line"></i>
        </div>
    </section>
    <main class="flex items-center justify-center flex-wrap bg-black rounded-lg p-7.5">
        <table>
            <tbody>
                <tr>
                    <td class="area"></td>
                    <td class="area"></td>
                    <td class="area"></td>
                </tr>
                <tr>
                    <td class="area"></td>
                    <td class="area"></td>
                    <td class="area"></td>
                </tr>
                <tr>
                    <td class="area"></td>
                    <td class="area"></td>
                    <td class="area"></td>
                </tr>
            </tbody>
        </table>
    </main>

    <section>
        <button id="btnNovaRodada">Nova Rodada</button>
        <button id="btnLimparJogo"> Reiniciar Jogo</button>
    </section>

    <script src="js/script.js"></script>
</body>
</html>

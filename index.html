<!DOCTYPE html>
<html lang="pt-br" class="size-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="w-full h-full flex flex-col justify-center items-center overflow-hidden bg-[#0c0c0c]">
    <main class="w-auto flex flex-col items-center">
        <section class="flex">
            <div id="placar" class="flex flex-row justify-center items-center gap-x-2 mb-5 p-2.5 rounded-lg bg-black">
                <i class="inline text-5xl md:text-6xl font-semibold text-[#0c0c0c] ri-circle-line"></i>
                <p class="text-white font-arial font-medium text-2xl md:text-3xl">0 - 0</p>
                <i class="inline text-5xl md:text-6xl text-[#0c0c0c] ri-close-large-line"></i>
            </div>
        </section>
        <section class="w-full flex items-center justify-center flex-wrap bg-black rounded-lg p-6">
            <table class="border-collapse border-9 border-black">
                <tbody>
                    <tr>
                        <td class="area"></td>
                        <td class="area"></td>
                        <td class="area"></td>
                    </tr>
                    <tr>
                        <td class="area"></td>
                        <td class="area"></td>
                        <td class="area"></td>
                    </tr>
                    <tr>
                        <td class="area"></td>
                        <td class="area"></td>
                        <td class="area"></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="w-full flex flex-row gap-x-2">
            <button class="w-1/2 bg-black text-[#181818] text-md md:text-xl font-semibold mt-5 p-1 md:p-2 rounded-md cursor-not-allowed" id="btnNovaRodada">Nova Rodada</button>
            <button class="w-1/2 bg-black text-[#181818] text-md md:text-xl font-semibold mt-5 p-1 md:p-2 rounded-md cursor-not-allowed" id="btnLimparJogo"> Reiniciar Jogo</button>
        </section>
    </main>

    <footer class="w-full fixed flex flex-col justify-center items-center gap-y-2 text-white/50 bottom-0 mb-4">
        <p class="text-xl text-center font-medium">Make by eduardo2382</p>
        <span class="flex flex-row gap-x-2 icons">
            <a class="no-underline" href="https://github.com/eduardo2382" target="_blank">
                <i class="text-3xl hover:text-white ri-github-fill"></i>
            </a>
            <a class="no-underline" href="https://www.instagram.com/edumotaa__/" target="_blank">
                <i class="text-3xl hover:text-white ri-instagram-line"></i>
            </a>
        </span>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
